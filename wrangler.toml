# Kelime Destesi — Cloudflare Pages yapılandırması
# Pages Function'ları otomatik algılanır (functions/). IP senkronu: /api/kv (KV binding: VOCAB).
#
# Kurulum (tek seferlik, Cloudflare Dashboard veya CLI):
#   1. Cloudflare Pages projesi oluştur (repo bağla veya direkt yükle)
#   2. Settings > Functions > KV namespace bindings > "VOCAB" adıyla bir KV namespace bağla
#      (yoksa önce: npx wrangler kv namespace create VOCAB)
#   3. İsteğe bağlı: VOCAB_SALT değişkeni ekle (Settings > Variables)
#
# Yerel test: npx wrangler pages dev .

name = "kelime-destesi"
compatibility_date = "2026-01-01"

# Yerel geliştirme için taklit KV binding (gerçek namespace prod'da bağlanır)
[[kv_namespaces]]
binding = "VOCAB"
id = "local-dev-placeholder"  # prod'da gerçek namespace id'si ile değiştirilir
